name: Deploy Release Branch

on:
  push:
    branches:
      - "release/*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Show branch
        run: echo "Deploying from ${{ github.ref_name }}"

      - name: Copy source code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./*" # ส่งทุกไฟล์ใน repo
          target: ${{ secrets.APP_DIR }}
          strip_components: 0

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_BRANCH
          script: |
            cd ${{ secrets.APP_DIR }} || exit 1

            # git fetch origin || exit 1
            # git checkout "$DEPLOY_BRANCH" || git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH" || exit 1
            # git pull origin "$DEPLOY_BRANCH" || exit 1

            VERSION="${DEPLOY_BRANCH#release/}"

            cat > .env << EOF
            # Auto-generated .env - Deploy from $DEPLOY_BRANCH
            VERSION=$VERSION
            MYSQL_HOST=${{ secrets.MYSQL_HOST }}
            MYSQL_PORT=${{ secrets.MYSQL_PORT }}
            MYSQL_DIALECT=${{ secrets.MYSQL_DIALECT }}
            MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_DB=${{ secrets.MYSQL_DB }}
            MYSQL_TIMEOUT=${{ secrets.MYSQL_TIMEOUT }}
            PORT=3003
            TELEGRAM_API_KEY=${{ secrets.TELEGRAM_API_KEY }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            LINE_TOKEN=${{ secrets.LINE_TOKEN }}
            LINE_SENDER_ID=${{ secrets.LINE_SENDER_ID }}
            GOOGLESHEET_ID=${{ secrets.GOOGLESHEET_ID }}
            GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
            GOOGLE_PRIVATE_KEY=${{ secrets.GOOGLE_PRIVATE_KEY }}
            EOF

            docker compose build --no-cache || exit 1
            docker compose up -d --force-recreate --remove-orphans || exit 1
            docker compose rm -f

            docker image prune -f --filter "label=com.docker.compose.project=uneed-cargo"


            echo "Deployed release branch ${{ github.ref_name }} successfully!"

      - name: Calculate tag name
        id: tag
        run: echo "name=v${GITHUB_REF_NAME#release/}" >> $GITHUB_OUTPUT
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create and push Git tag
        if: success()
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ steps.tag.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Send Telegram notification
        if: success()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_API_KEY }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="🚀 *Deploy สำเร็จ!*  
            Version: \`${{ steps.tag.outputs.name }}\`  
            Branch: ${{ github.ref_name }}  
            Commit: ${{ github.sha }}"
